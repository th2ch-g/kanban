name: test

on:
  push:
    branches:
      # '*' stops at a slash, so dev/... branches were never tested.
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: cargo version
        run: cargo --version
      # web/ is include_str!'d into the binary, so a syntax error there compiles
      # cleanly and ships. Nothing else checks it.
      - name: check web assets
        run: |
          node --check web/app.js
          sh -n web/serve.sh
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys
          VOID = {'meta','link','br','hr','img','input','area','base','col',
                  'embed','source','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack = []; self.bad = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID: self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in VOID: return
                  if not self.stack or self.stack[-1] != tag:
                      self.bad.append(f'unexpected </{tag}>')
                      if tag in self.stack:
                          while self.stack and self.stack.pop() != tag: pass
                  else:
                      self.stack.pop()
          p = P(); p.feed(open('web/index.html').read())
          if p.stack or p.bad:
              sys.exit(f'index.html: unclosed={p.stack} errors={p.bad}')
          print('web assets ok')
          PY
      - name: test single
        run: cargo run -r --bin kanban single -m "aaa" -@ 2 -t 3 --tmpdir ./single
      - name: test multiple
        run: cargo run -r --bin kanban multiple -m "aaa" -@ 2 -t 3 --tmpdir ./multiple
      - name: test multiple2
        run: cargo run -r --bin kanban multiple2 -m "aaa" "bbb" "ccc" -t 3 --tmpdir ./multiple2
      - name: test long
        run: cargo run -r --bin kanban long -m "aaabbb" -t 3 -l 3 --tmpdir ./long
      - name: test vertical
        run: cargo run -r --bin kanban vertical -m "aa" "bb" -t 3 --tmpdir ./vertical
      - name: test wave
        run: cargo run -r --bin kanban wave -m "aaabbb" -@ 1 -l 3 --tmpdir ./wave
      - name: test raw-single
        run: cargo run -r --bin kanban raw-single -m "aaa" -@ 2 -t 3
      # The procname method names threads instead of compiling binaries, and
      # had never been exercised here.
      - name: test single (procname)
        run: cargo run -r --bin kanban single -m "aaa" -@ 2 -t 3 --method procname
      - name: test multiple2 (procname)
        run: cargo run -r --bin kanban multiple2 -m "aaa" "bbb" "ccc" -t 3 --method procname
      - name: test long (procname)
        run: cargo run -r --bin kanban long -m "aaabbb" -t 3 -l 3 --method procname
