name: pages

# Publishes web/ - the same UI `kanban serve` embeds in the binary. Visiting the
# published copy without a local kanban running gets instructions rather than a
# broken run button; with one running it can drive it cross-origin.
#
# Needs Pages enabled on the repository with its source set to GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'kanban-core/**'
      - 'kanban-wasm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway, but only one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets the page preview a layout before you have a kanban running. Raw
      # extern "C" rather than wasm-bindgen, so plain cargo is the whole
      # toolchain.
      - name: build wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -r -p kanban-wasm --target wasm32-unknown-unknown

      - name: assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css _site/
          cp web/serve.sh _site/
          cp target/wasm32-unknown-unknown/release/kanban_wasm.wasm _site/
          cp img/logo.png _site/ 2>/dev/null || true
          # Jekyll would otherwise swallow anything starting with an underscore.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
