name: Dependabot auto-merge

# Auto-merge every Dependabot PR, including major bumps, after required CI passes.
# Requires "Allow auto-merge" and main branch protection with these checks:
#   - build, build-mpi, and lint from cargo.yaml
#   - test from test.yml
# format only runs on pushes, so it must not be required for pull requests.

on: pull_request

#  Avoid two runs racing on the same PR when Dependabot pushes a rebased commit.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Use the PR author from the event payload, not github.actor: actor is
    # spoofable on re-runs, the PR author is fixed in the payload.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
