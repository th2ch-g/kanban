[package]
name = "kanban_gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
pollster = "1.0"

[[bin]]
# kanban rewrites this name to the message, which is what nvtop shows. The
# placeholder is a valid crate name so the template builds untouched.
name = "kanban_gpu_template"
path = "main.rs"
