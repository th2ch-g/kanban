[package]
name = "kanban-wasm"
version.workspace = true
description = "kanban: the layout logic, compiled for the browser"
edition.workspace = true
authors.workspace = true

# A cdylib with a raw extern "C" surface rather than wasm-bindgen. kanban-core
# has no dependencies, so this needs nothing beyond `cargo build --target
# wasm32-unknown-unknown` - no wasm-pack in CI, and no glue whose version has to
# stay in step with a JS package.
[lib]
crate-type = ["cdylib"]

[dependencies]
kanban-core.workspace = true
